name: Build FlinRP AMX (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pawn-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar unzip coreutils gdb

      - name: Extract source ZIP
        run: |
          test -s FlinRP_Linux_BUILD_PREP_v10_GITHUB_ACTIONS.zip
          mkdir -p source
          unzip -oq FlinRP_Linux_BUILD_PREP_v10_GITHUB_ACTIONS.zip -d source
          test -s source/gamemodes/main.pwn
          test -s source/pawno/include/a_samp.inc
          test -s source/pawno/include/a_mysql.inc
          test -s source/pawno/include/streamer.inc

      - name: Download Pawn compiler
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz"
          expected="9bbb1df6e933318fce1fa61951e4196b70613c637a5a1d4c96937e147c18468d"
          curl -fL --retry 2 "$url" -o /tmp/pawnc.tar.gz
          echo "$expected  /tmp/pawnc.tar.gz" | sha256sum -c -
          mkdir -p /tmp/pawnc
          tar -xzf /tmp/pawnc.tar.gz -C /tmp/pawnc
          find /tmp/pawnc -type f -name pawncc -perm -u+x -print -quit > /tmp/pawncc_path
          test -s /tmp/pawncc_path

      - name: Compile FlinRP
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="$(find /tmp/pawnc -type f -name libpawnc.so -print -quit | xargs -r dirname)"
          test -n "$lib_dir"
          export LD_LIBRARY_PATH="$lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          pawncc="$(cat /tmp/pawncc_path)"
          printf 'main() { return 1; }\n' > /tmp/pawn_smoke.pwn
          "$pawncc" /tmp/pawn_smoke.pwn -o/tmp/pawn_smoke.amx
          test -s /tmp/pawn_smoke.amx
          echo "PAWN_SMOKE_TEST_OK"
          cd source/gamemodes
          include_failures=0
          for inc in a_samp a_mysql streamer; do
            printf '#include <%s>\nmain() { return 1; }\n' "$inc" > "/tmp/test_${inc}.pwn"
            echo "TESTING_INCLUDE: $inc"
            if "$pawncc" "/tmp/test_${inc}.pwn" -i../pawno/include -i. -o"/tmp/test_${inc}.amx"; then
              echo "INCLUDE_TEST_OK: $inc"
            else
              rc=$?
              echo "INCLUDE_TEST_FAILED: $inc (exit $rc)"
              include_failures=$((include_failures + 1))
            fi
          done
          if [ "$include_failures" -ne 0 ]; then
            echo "STOPPING_BEFORE_MAIN_SOURCE: include tests failed"
            exit 1
          fi
          echo "ALL_INCLUDE_TESTS_OK"
          echo "TESTING_INCLUDE: foreach with source macros"
          printf '#include <a_samp>\n#define FOREACH_I_PlayerPlayersStream\n#define FOREACH_I_PlayerVehiclesStream\n#include <foreach>\nmain() { return 1; }\n' > /tmp/test_foreach.pwn
          if "$pawncc" /tmp/test_foreach.pwn -i../pawno/include -i. -o/tmp/test_foreach.amx; then
            test -s /tmp/test_foreach.amx
            echo "INCLUDE_TEST_OK: foreach"
          else
            rc=$?
            echo "INCLUDE_TEST_FAILED: foreach (exit $rc)"
            exit 1
          fi
          echo "TESTING_INCLUDE: foreach Iter_Add"
          cat > /tmp/test_foreach_add.pwn <<'PAWN'
          #include <a_samp>
          #define FOREACH_I_PlayerPlayersStream
          #define FOREACH_I_PlayerVehiclesStream
          #include <foreach>
          #define MAX_JOBS 20
          new Iterator:gJobPlayers[MAX_JOBS]<MAX_PLAYERS>;
          main()
          {
              Iter_Init(gJobPlayers);
              Iter_Add(gJobPlayers[1], 0);
              return 1;
          }
          PAWN
          if "$pawncc" /tmp/test_foreach_add.pwn -i../pawno/include -i. -o/tmp/test_foreach_add.amx; then
            test -s /tmp/test_foreach_add.amx
            echo "ITER_ADD_TEST_OK"
          else
            rc=$?
            echo "ITER_ADD_TEST_FAILED: exit $rc"
            exit 1
          fi
          echo "Starting GDB diagnostic for FlinRP..."
          gdb --batch --quiet \
            -ex "set pagination off" \
            -ex run \
            -ex "thread apply all bt full" \
            --args "$pawncc" main.pwn -i../pawno/include -i. -o../../gm.amx \
            > /tmp/pawn-gdb.log 2>&1 || true
          cat /tmp/pawn-gdb.log
          if grep -q "Program received signal SIGSEGV" /tmp/pawn-gdb.log; then
            echo "GDB_CONFIRMED_COMPILER_CRASH"
            exit 1
          fi
          test -s ../../gm.amx

      - name: Upload compiled AMX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flinrp-pawn-build
          path: gm.amx
          if-no-files-found: warn
          retention-days: 7
